name: Dependabot auto-merge

on:
  # Trusted API-only automation: no checkout, PR code, dependency install, or cache.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot-auto-merge:
    name: dependabot-auto-merge
    # Write access is reserved for the owner and this workflow. Never check out
    # PR code, install PR dependencies, or restore PR caches in this job.
    if: >-
      github.event.repository.owner.type == 'User' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to enable merging; never used to push commits.
      pull-requests: write # Required to enable auto-merge on a verified PR.
    steps:
      - name: Verify every PR commit belongs to Dependabot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # fetch-metadata v3.1.0 verifies only the first commit. Check all pages
          # ourselves, including the event head, before trusting its metadata.
          gh api --paginate --slurp "repos/$GH_REPO/pulls/$PR_NUMBER/commits" \
            > "$RUNNER_TEMP/dependabot-commits.json"
          jq -e --arg head "$PR_HEAD_SHA" '
            flatten | length > 0 and .[-1].sha == $head and
            all(.[];
              .author.login == "dependabot[bot]" and
              .commit.verification.verified == true
            )
          ' "$RUNNER_TEMP/dependabot-commits.json"

      - name: Read verified Dependabot update type
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge for verified patch and minor updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed on template copies or if the required CI rule is removed.
          # 15368 is the GitHub Actions App on github.com, not an arbitrary check producer.
          gh api "repos/$GH_REPO/rules/branches/$BASE_BRANCH" > "$RUNNER_TEMP/dependabot-branch-rules.json"
          jq -e 'any(.[];
            .type == "required_status_checks" and
            .parameters.strict_required_status_checks_policy == true and
            any(.parameters.required_status_checks[];
              .context == "dependency-update-ci" and .integration_id == 15368
            )
          )' "$RUNNER_TEMP/dependabot-branch-rules.json"

          # Never bypass branch rules. Reject a stale event if the PR head changed.
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash \
            --match-head-commit "$PR_HEAD_SHA"
