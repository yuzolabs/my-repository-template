name: Security Scan

on:
  pull_request:
    branches: [main]

permissions: {} # デフォルトの広い権限を使わないよう明示的に空にする

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read # PRのコミット一覧取得 (GET /repos/{owner}/{repo}/pulls/{n}/commits) に必要。不足だと gitleaks-action が 403 でクラッシュする
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.165.0@sha256:f4791a54c891eabe1188248135574e6e03dfc31dfd3f3b747c7bec7079bfed1b # v1.165.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: semgrep scan --config=auto --error

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest # zizmor-action が Docker で実行されるため slim 不可
    permissions:
      contents: read
      actions: read # オンライン監査でアクション参照を解決するため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          annotations: true
          advanced-security: false # findings でジョブを失敗させる（semgrep --error と同挙動）

  dependency-validation:
    name: dependency-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Read PR dependency manifests without write access.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Validate dependency lockfiles and tool startup
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bunx --no-install markdownlint-cli2 --version
          bunx --no-install textlint --version
          uv sync --locked --group dev
          uv run --no-sync prek --version
      - name: Test Dependabot auto-merge guards
        run: uv run --no-project --with pyyaml==6.0.3 python -B -m unittest discover -s .github/tests -v

  dependency-update-ci:
    # Require this exact check from the GitHub Actions App in the main ruleset.
    name: dependency-update-ci
    needs: [gitleaks, semgrep, zizmor, dependency-validation]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every dependency check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$CHECK_RESULTS"
